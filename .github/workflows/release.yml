name: SystemPilot Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows Installers (EXE, MSI, Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Version Consistency
        shell: powershell
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $tagVer = $ref -replace "refs/tags/v", ""
            Write-Host "Verifying tag version: $tagVer"
            
            # Check package.json
            $pkg = Get-Content "package.json" | ConvertFrom-Json
            if ($pkg.version -ne $tagVer) {
              Write-Error "Version mismatch: package.json has $($pkg.version) but tag is $tagVer"
              exit 1
            }
            
            # Check frontend/package.json
            $frontPkg = Get-Content "frontend/package.json" | ConvertFrom-Json
            if ($frontPkg.version -ne $tagVer) {
              Write-Error "Version mismatch: frontend/package.json has $($frontPkg.version) but tag is $tagVer"
              exit 1
            }
            
            # Check tauri.conf.json
            $tauriConf = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
            if ($tauriConf.version -ne $tagVer) {
              Write-Error "Version mismatch: tauri.conf.json has $($tauriConf.version) but tag is $tagVer"
              exit 1
            }
            
            Write-Host "[OK] All versions match tag: v$tagVer"
          } else {
            Write-Host "Manual trigger or non-tag push; skipping strict tag version check."
          }

      - name: Build Tauri Packages (EXE & MSI)
        env:
          RUST_MIN_STACK: "16777216"
        run: npm run tauri build

      - name: Prepare Release Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts

          # Copy NSIS EXE Setup Installer
          $nsisExes = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $nsisExes) {
            Copy-Item $file.FullName -Destination "release-artifacts/$($file.Name)"
            Write-Host "Found NSIS EXE: $($file.Name)"
          }

          # Copy WiX MSI Installer
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($file in $msiFiles) {
            Copy-Item $file.FullName -Destination "release-artifacts/$($file.Name)"
            Write-Host "Found MSI: $($file.Name)"
          }

          # Create Portable ZIP from release binary & required WebView2Loader.dll
          $rawBinary = "src-tauri/target/release/SystemPilot.exe"
          $dllBinary = "src-tauri/target/release/WebView2Loader.dll"
          if (Test-Path $rawBinary) {
            $zipItems = @($rawBinary)
            if (Test-Path $dllBinary) { $zipItems += $dllBinary }
            Compress-Archive -Path $zipItems -DestinationPath "release-artifacts/SystemPilot-Portable-x64.zip" -Force
            Write-Host "Created Portable ZIP: release-artifacts/SystemPilot-Portable-x64.zip"
          }

      - name: Sign Windows Binaries (Authenticode Code Signing)
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          Write-Host "Authenticode Code Signing Certificate detected. Decoding PFX..."
          $pfxPath = "$env:TEMP\systempilot_code_sign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Warning "signtool.exe not found in Windows Kits; using PATH default..."
            $signtool = "signtool.exe"
          }

          $artifacts = Get-ChildItem -Path "release-artifacts/*.exe", "release-artifacts/*.msi"
          foreach ($file in $artifacts) {
            Write-Host "Signing $($file.Name)..."
            & $signtool sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $file.FullName
          }
          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Host "Authenticode code signing completed successfully."

      - name: Generate Cryptographic SHA-256 Checksums
        shell: powershell
        run: |
          # Generate SHA256 Checksums for all release artifacts
          $allArtifacts = Get-ChildItem -Path "release-artifacts/*" -Exclude "SHA256SUMS.txt"
          $checksumLines = @()
          foreach ($item in $allArtifacts) {
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash
            $checksumLines += "$hash  $($item.Name)"
          }
          $checksumLines | Out-File -FilePath "release-artifacts/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt with $($checksumLines.Count) entries."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
