name: Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Windows Installers (EXE, MSI, Portable)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix frontend install

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Version Consistency
        shell: powershell
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $tagVer = $ref -replace "refs/tags/v", ""
            Write-Host "Verifying tag version: $tagVer"
            
            # Check package.json
            $pkg = Get-Content "package.json" | ConvertFrom-Json
            if ($pkg.version -ne $tagVer) {
              Write-Error "Version mismatch: package.json has $($pkg.version) but tag is $tagVer"
              exit 1
            }
            
            # Check frontend/package.json
            $frontPkg = Get-Content "frontend/package.json" | ConvertFrom-Json
            if ($frontPkg.version -ne $tagVer) {
              Write-Error "Version mismatch: frontend/package.json has $($frontPkg.version) but tag is $tagVer"
              exit 1
            }
            
            # Check tauri.conf.json
            $tauriConf = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
            if ($tauriConf.version -ne $tagVer) {
              Write-Error "Version mismatch: tauri.conf.json has $($tauriConf.version) but tag is $tagVer"
              exit 1
            }
            
            Write-Host "[OK] All versions match tag: v$tagVer"
          } else {
            Write-Host "Manual trigger or non-tag push; skipping strict tag version check."
          }

      - name: Build Tauri Packages (EXE & MSI)
        run: npm run tauri build

      - name: Prepare Release Artifacts & Generate SHA-256 Checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts

          # Copy NSIS EXE Setup Installer
          $nsisExes = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $nsisExes) {
            Copy-Item $file.FullName -Destination "release-artifacts/$($file.Name)"
            Write-Host "Found NSIS EXE: $($file.Name)"
          }

          # Copy WiX MSI Installer
          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($file in $msiFiles) {
            Copy-Item $file.FullName -Destination "release-artifacts/$($file.Name)"
            Write-Host "Found MSI: $($file.Name)"
          }

          # Create Portable ZIP from release binary
          $rawBinary = "src-tauri/target/release/SystemPilot.exe"
          if (Test-Path $rawBinary) {
            Compress-Archive -Path $rawBinary -DestinationPath "release-artifacts/SystemPilot-Portable-x64.zip" -Force
            Write-Host "Created Portable ZIP: release-artifacts/SystemPilot-Portable-x64.zip"
          }

          # Generate SHA256 Checksums for all release artifacts
          $allArtifacts = Get-ChildItem -Path "release-artifacts/*" -Exclude "SHA256SUMS.txt"
          $checksumLines = @()
          foreach ($item in $allArtifacts) {
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash
            $checksumLines += "$hash  $($item.Name)"
          }
          $checksumLines | Out-File -FilePath "release-artifacts/SHA256SUMS.txt" -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt with $($checksumLines.Count) entries."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.zip
            release-artifacts/SHA256SUMS.txt
