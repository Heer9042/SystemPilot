name: SystemPilot CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-validation:
    name: Application Interface Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run Interface Version & Logic Tests
        run: node scripts/test_version.js

      - name: Build Application Interface Assets
        run: npm --prefix frontend run build

  system-layer-validation:
    name: System Layer Validation
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust Code Formatting Check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust System Compilation Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run System Layer Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-build-validation:
    name: Windows Application Build Validation
    needs: [frontend-validation, system-layer-validation]
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Root & Frontend Dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Application Frontend
        run: npm --prefix frontend run build

      - name: Validate Tauri Application Compilation
        env:
          RUST_MIN_STACK: "16777216"
        run: npx tauri build --no-bundle
